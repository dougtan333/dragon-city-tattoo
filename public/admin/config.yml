backend:
  name: github
  repo: dougtan333/dragon-city-tattoo
  branch: main
  base_url: https://dragon-city-tattoo.vercel.app
  auth_endpoint: oauth

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "config"
    label: "Site Config"
    description: "Edit shop details, hours, FAQ, and about section"
    files:
      - name: "shop"
        label: "Shop Details"
        file: "src/content/config/shop.yaml"
        fields:
          - { label: "Shop Name", name: "name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - { label: "Phone", name: "phone", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - label: "Address"
            name: "address"
            widget: "object"
            fields:
              - { label: "Street", name: "street", widget: "string" }
              - { label: "Suburb", name: "suburb", widget: "string" }
              - { label: "State", name: "state", widget: "string" }
              - { label: "Postcode", name: "postcode", widget: "string" }
              - { label: "Country", name: "country", widget: "string" }
              - { label: "Google Maps Embed URL", name: "google_maps_embed", widget: "string" }
              - { label: "Google Maps Link", name: "google_maps_link", widget: "string" }
          - label: "Hours"
            name: "hours"
            widget: "list"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Open", name: "open", widget: "string" }
              - { label: "Close", name: "close", widget: "string" }
          - label: "Socials"
            name: "socials"
            widget: "object"
            fields:
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "TikTok", name: "tiktok", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
          - { label: "Google Place ID", name: "google_place_id", widget: "string" }
          - { label: "Google Reviews Enabled", name: "google_reviews_enabled", widget: "boolean" }
          - { label: "Google Reviews URL", name: "google_reviews_url", widget: "string" }
          - { label: "Booking URL", name: "booking_url", widget: "string" }
          - { label: "Booking CTA Text", name: "booking_cta", widget: "string" }
          - { label: "Walk-ins Welcome", name: "walkins_welcome", widget: "boolean" }
          - { label: "Meta Title", name: "meta_title", widget: "string" }
          - { label: "Meta Description", name: "meta_description", widget: "text" }
          - { label: "Meta Image", name: "meta_image", widget: "image", required: false }
          - { label: "Locale", name: "locale", widget: "string" }
          - label: "Features"
            name: "features"
            widget: "object"
            fields:
              - { label: "Chatbot Enabled", name: "chatbot_enabled", widget: "boolean" }
              - { label: "Gallery Filter", name: "gallery_filter", widget: "boolean" }
              - { label: "Artist Profiles", name: "artist_profiles", widget: "boolean" }
              - { label: "Reviews Section", name: "reviews_section", widget: "boolean" }
              - { label: "Facebook Feed", name: "facebook_feed", widget: "boolean" }
          - { label: "Facebook Page URL", name: "facebook_page_url", widget: "string", required: false }
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Story", name: "story", widget: "text" }
              - label: "Values"
                name: "values"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "FAQ"
            name: "faq"
            widget: "list"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "artists"
    label: "Artists"
    description: "Manage artist profiles"
    files:
      - name: "artists-list"
        label: "Artist Profiles"
        file: "src/content/config/artists.yaml"
        fields:
          - label: "Artists"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role", name: "role", widget: "string" }
              - label: "Specialties"
                name: "specialties"
                widget: "list"
                field: { label: "Specialty", name: "specialty", widget: "string" }
              - { label: "Bio", name: "bio", widget: "text" }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Featured", name: "featured", widget: "boolean", default: true }

  - name: "gallery"
    label: "Gallery"
    description: "Manage gallery photos"
    files:
      - name: "gallery-list"
        label: "Gallery Items"
        file: "src/content/config/gallery.yaml"
        fields:
          - label: "Gallery Items"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Artist", name: "artist", widget: "select", options: ["clint-baxter", "luke-baxter"] }
              - { label: "Style", name: "style", widget: "select", options: ["Freehand", "Realism", "Traditional", "Cover-up", "Custom", "Blackwork", "Japanese", "Portraits"] }

  - name: "reviews"
    label: "Reviews"
    description: "Manage customer reviews"
    files:
      - name: "reviews-list"
        label: "Customer Reviews"
        file: "src/content/config/reviews.yaml"
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            fields:
              - { label: "Customer Name", name: "name", widget: "string" }
              - { label: "Rating", name: "rating", widget: "number", min: 1, max: 5 }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
              - { label: "Source", name: "source", widget: "select", options: ["Google", "Facebook", "Walk-in"] }
              - { label: "Review Text", name: "text", widget: "text" }
              - { label: "Artist", name: "artist", widget: "select", options: ["clint-baxter", "luke-baxter"], required: false }
