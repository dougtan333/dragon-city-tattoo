about:
  headline: A family tradition in ink
  intro: Dragon City Tattoo is a licensed family tattoo parlour in Box Hill South,
    established in 1985 by Steve Baxter and re-established in 2015 by Clint
    Baxter. We're one of Melbourne's longest-running tattoo studios, with over
    65 years of combined experience across the family.
  story: >
    Dragon City Tattoo has been part of the Box Hill community for over 40
    years. What started as Steve Baxter's passion in 1988 has grown into a
    family tradition - with father and sons bringing decades of combined
    tattooing experience to every piece.


    Re-established in 2015 by Clint Baxter, the studio carries forward the same commitment to quality craftsmanship, personalised service, and a welcoming atmosphere that made it a local institution in Melbourne's eastern suburbs.


    Whether you're after a custom design, a freehand piece, a detailed cover-up, or your very first tattoo, we treat every client like family. We pride ourselves on a clean, professional studio and a relaxed vibe where you can feel comfortable from the moment you walk in.


    Located on Canterbury Road in Box Hill South - just minutes from Box Hill Central, Blackburn, Mont Albert, and Surrey Hills - we're easy to reach by car or public transport. Walk-ins are always welcome, or give us a call to book your session.
  values:
    - title: Family-Owned Since 1985
      description: Three generations of tattooing expertise right here in Box Hill
        South. We've been part of the Melbourne eastern suburbs community for
        over 40 years.
    - title: Walk-ins Welcome
      description: No appointment needed - drop in Monday to Saturday. Weekdays are
        quieter for walk-ins. Call ahead on (03) 9890 2734 if you'd like to
        guarantee a time.
    - title: Clean & Professional
      description: Licensed tattoo parlour with strict hygiene standards. Single-use
        needles, hospital-grade sterilisation, and premium inks. Your safety and
        comfort are our top priority.
faq:
  - question: How much does a tattoo cost at Dragon City Tattoo?
    answer: Pricing depends on size, detail, placement, and the time involved. As a
      guide, small pieces start from around $150, medium work typically runs
      $300-$800, and larger pieces like sleeves or back work are quoted
      individually after a consultation. We're always upfront about pricing -
      you'll know the cost before we start. Drop into our Box Hill South studio
      or call (03) 9890 2734 to discuss your idea and get an accurate quote.
  - question: Do you accept walk-ins?
    answer: Absolutely - walk-ins are welcome Monday to Saturday at our Box Hill
      South studio. Weekdays tend to be quieter, so you'll have the best chance
      of being seen straight away. For larger custom work or guaranteed session
      times, we recommend calling ahead on (03) 9890 2734 to book.
  - question: How do I book a tattoo appointment?
    answer: You can book by calling us on (03) 9890 2734, dropping into the studio
      at 893 Canterbury Road in Box Hill South, or sending a DM on Instagram
      (@clintbaxtertatt2). For custom designs, we'll arrange a free
      consultation first to discuss your vision, placement, and pricing.
  - question: What tattoo styles do you specialise in?
    answer: Our artists cover a wide range of styles including custom designs,
      freehand work, traditional and neo-traditional, realism and portraits,
      Japanese (irezumi), blackwork, cover-ups, fine line, geometric, and
      lettering. Check out our gallery or Instagram to see examples of each
      style. We're happy to discuss which approach will work best for your idea.
  - question: How should I prepare for my tattoo appointment?
    answer: Eat a good meal beforehand and stay well hydrated. Wear comfortable,
      loose-fitting clothing that gives easy access to the area being tattooed.
      Get a good night's sleep the night before. Avoid alcohol and
      blood-thinning medications for at least 24 hours before your session. If
      you have any medical conditions or allergies, let your artist know before
      we start.
  - question: What is the tattoo aftercare process?
    answer: We'll cover your fresh tattoo with a breathable bandage. Keep it on for
      the time your artist recommends (usually 2–4 hours). Then gently wash with
      lukewarm water and unscented antibacterial soap, pat dry with a clean
      towel, and apply a thin layer of the aftercare balm we recommend. For the
      first 2–3 weeks, avoid submerging in water (pools, baths, ocean), direct
      sunlight, and picking or scratching at any scabs. Melbourne's UV is strong
      - once healed, always use sunscreen over your tattoo to keep the colours
      vibrant.
  - question: Can I bring my own tattoo design?
    answer: Absolutely. Bring reference images, sketches, photos, or even just a
      description of what you're after - our artists will work with you to
      refine it into a tattoo-ready design. We can also create something
      entirely original from scratch based on a brief. The design process is
      collaborative, and we won't start tattooing until you're completely happy
      with the artwork.
  - question: Do you do cover-up tattoos?
    answer: Yes - cover-ups are one of our specialities. Whether it's an old tattoo
      you've outgrown, faded work, or something you want transformed, our
      artists are experienced in designing cover-ups that look like they were
      always meant to be there. Book a free consultation so we can assess the
      existing tattoo and discuss the best approach.
  - question: Do you tattoo minors?
    answer: We do not tattoo anyone under the age of 18, even with parental consent.
      This is in line with Victorian law and our studio policy. We're happy to
      book clients in for their 18th birthday session though!
  - question: Is getting a tattoo painful?
    answer: Everyone's pain tolerance is different. Generally, fleshier areas like
      the upper arm, thigh, and calf are less sensitive, while bonier spots like
      ribs, feet, and inner wrist tend to be more intense. Most clients describe
      it as a scratching or buzzing sensation rather than sharp pain. Our
      artists work at a steady pace and are happy to take breaks whenever you
      need them. First-timers are always surprised by how manageable it is.
  - question: What's the difference between freehand and custom tattoos?
    answer: A custom tattoo is designed on paper or digitally before your session -
      you'll see the artwork and approve it before any ink touches skin. A
      freehand tattoo is drawn directly onto your body by the artist, allowing
      the design to flow naturally with your body's contours and musculature.
      Both approaches produce incredible results; freehand is especially
      effective for larger organic pieces that need to wrap around curves. Our
      artists are skilled in both methods.
  - question: Where is Dragon City Tattoo located?
    answer: We're at 893 Canterbury Road, Box Hill South, VIC 3128 - in Melbourne's
      eastern suburbs. We're close to Box Hill Central shopping centre, and
      easily accessible from Blackburn, Mont Albert, Surrey Hills, Balwyn,
      Doncaster, and the wider Melbourne eastern suburbs. There's street parking
      available along Canterbury Road and in nearby side streets.
  - question: What payment methods do you accept?
    answer: We accept cash, EFTPOS, Visa, Mastercard, and major debit cards. Payment
      is due at the end of your session. For custom work requiring a deposit,
      we'll let you know the amount when we book you in.
