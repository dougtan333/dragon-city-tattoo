about:
  headline: "A family tradition in ink"
  intro: "Dragon City Tattoo is a licensed family tattoo parlour, established in 1988 by Steve Baxter and re-established in 2015 by Clint Baxter."
  story: |
    Dragon City Tattoo has been part of the Box Hill community for over 35 years. What started as Steve Baxter's passion in 1988 has grown into a family tradition — with father and sons bringing over 65 years of combined tattooing experience to every piece.

    Re-established in 2015 by Clint Baxter, the studio carries forward the same commitment to quality, personalised service, and a welcoming atmosphere that made it a local institution. Whether you're after a custom design, a freehand piece, a cover-up, or your very first tattoo, we treat every client like family.

    We pride ourselves on a clean, professional studio and a relaxed vibe. Walk-ins are always welcome, or give us a call to book your session.
  values:
    - title: "Family-owned since 1988"
      description: "Three generations of tattooing expertise. We've been part of the Box Hill community for over 35 years."
    - title: "Walk-ins welcome"
      description: "No appointment needed — drop in Monday to Saturday. Call ahead if you'd like to guarantee a time."
    - title: "Clean & professional"
      description: "Licensed parlour with strict hygiene standards. Your safety and comfort are our top priority."

faq:
  - question: "How much does a tattoo cost?"
    answer: "Pricing depends on size, detail, placement, and time. It's best to drop into the shop or give us a call at (03) 9890 2734 to discuss your idea and get an accurate quote. We're happy to chat through options for any budget."
  - question: "Do you accept walk-ins?"
    answer: "Absolutely — walk-ins are welcome Monday to Saturday. Weekdays tend to be quieter so you'll have the best chance of being seen straight away. For guaranteed sessions, call ahead to book."
  - question: "How do I book an appointment?"
    answer: "Give us a call on (03) 9890 2734 or drop into the shop at 893 Canterbury Road, Box Hill South. You can also reach us via Instagram DM or email at Baxtatt2@yahoo.com."
  - question: "What styles do you specialise in?"
    answer: "Our artists cover a wide range including custom designs, freehand work, traditional, realism, portraits, cover-ups, Japanese, blackwork, and more. Have a look at our gallery or check out Clint's Instagram for recent work."
  - question: "Is it your first tattoo?"
    answer: "No worries — we get a lot of first-timers and we'll make you feel comfortable from start to finish. We'll walk you through the whole process, help you choose the right placement and size, and make sure you're happy with the design before we start."
  - question: "How should I prepare for my appointment?"
    answer: "Eat a good meal beforehand, stay hydrated, wear comfortable clothing that gives easy access to the tattoo area, and get a decent night's sleep. Avoid alcohol for 24 hours before your session."
  - question: "What's the aftercare process?"
    answer: "We'll give you full aftercare instructions after your session. Generally — keep it clean, moisturised, and out of direct sunlight for the first few weeks. Avoid swimming and picking at any scabbing. Follow the aftercare and your tattoo will heal beautifully."
  - question: "Can I bring my own design?"
    answer: "Of course. Bring reference images, sketches, or ideas and we'll work with you to make it tattoo-ready. We can also create something from scratch if you give us a brief of what you're after."
