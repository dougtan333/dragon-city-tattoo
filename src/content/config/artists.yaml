  - id: clint-baxter
    name: Clint Baxter
    role: Owner & Lead Artist
    specialties:
      - Custom
      - Freehand
      - Traditional
      - Realism
      - Cover-Ups
      - Portraits
    bio: >-
      Clint Baxter is the owner and lead artist at Dragon City Tattoo in Box
      Hill, Melbourne. Following in his father Steve Baxter's footsteps - who
      founded the original studio in 1985 - Clint re-established Dragon City
      Tattoo in 2015 and has built it into one of Melbourne's eastern suburbs'
      most trusted tattoo parlours.


      With decades of hands-on experience, Clint specialises in custom designs, freehand work, realism, portraits, traditional tattoos, and cover-ups. He's known for his ability to work collaboratively with clients, transforming ideas and references into one-of-a-kind pieces that stand the test of time.


      Whether it's your first tattoo or a full sleeve, Clint's approach is the same - listen to the client, design something meaningful, and execute it with precision and care.
    instagram: https://www.instagram.com/clintbaxtertatt2/
    image: /images/artists/clint-baxter.jpg
    featured: true
